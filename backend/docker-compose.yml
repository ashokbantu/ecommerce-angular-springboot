version: "3.9"

volumes:
  maven-repo:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot init container: builds and installs common-lib (and warms the
  # shared Maven repo cache) BEFORE any service container starts. This avoids
  # each service container resolving `com.ecommerce:common-lib` on its own
  # and failing with "Could not find artifact com.ecommerce:common-lib".
  maven-build:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - ./:/app
      - maven-repo:/root/.m2
    command: mvn -pl common-lib -am install -DskipTests

  # NOTE: service containers below intentionally do NOT use `-am` with
  # `spring-boot:run`. `-am` pulls the parent reactor POM (backend-parent)
  # into the build, which has no main class and causes:
  # "Unable to find a suitable main class". Instead, common-lib is built
  # once by maven-build above and resolved from the shared maven-repo cache.
  #
  # eureka-server and config-server use healthchecks (via Actuator's
  # /actuator/health, which both already depend on) so that dependents wait
  # for the Spring context to actually be UP -- not just for the container
  # process to start -- avoiding "Connection refused" races on startup.

  eureka-server:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - ./:/app
      - maven-repo:/root/.m2
    command: mvn -pl eureka-server spring-boot:run
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      maven-build:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  config-server:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - ./:/app
      - maven-repo:/root/.m2
    command: mvn -pl config-server spring-boot:run
    ports:
      - "8888:8888"
    environment:
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      maven-build:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy

  api-gateway:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - ./:/app
      - maven-repo:/root/.m2
    command: mvn -pl api-gateway spring-boot:run
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
    depends_on:
      maven-build:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy

  auth-service:
